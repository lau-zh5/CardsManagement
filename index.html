<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>卡包</title>
<meta name="theme-color" content="#F5F5F7">
<meta name="description" content="本地加密的卡片管理工具，数据只留在你的设备上">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="卡包">
<meta name="color-scheme" content="light">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app"></div>
<div id="overlay-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script>
/* 启动守卫：模块脚本一旦加载/导入失败，页面会纯白且无任何提示。
   这里用普通脚本先挂上兜底，超时未见渲染就给出可操作的诊断页。 */
(function () {
  var app = document.getElementById('app');
  var shown = false;
  var lastError = '';

  window.addEventListener('error', function (e) {
    if (e && e.message) lastError = String(e.message);
    if (e && e.target && e.target !== window && e.target.src)
      lastError = '资源加载失败：' + e.target.src;
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    if (e && e.reason) lastError = String(e.reason.message || e.reason);
  });

  function clearAndReload() {
    var jobs = [];
    if ('serviceWorker' in navigator) {
      jobs.push(navigator.serviceWorker.getRegistrations()
        .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
        .catch(function () {}));
    }
    if (window.caches) {
      jobs.push(caches.keys()
        .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
        .catch(function () {}));
    }
    Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
  }

  function showProblem() {
    if (shown || window.__cardsappBooted || (app && app.innerHTML.trim())) return;
    shown = true;
    var isFile = location.protocol === 'file:';
    var reason = isFile
      ? '你是直接双击 index.html 打开的。Chrome 会拦截 <b>file://</b> 下的 ES 模块，页面脚本完全没有运行。请改用 <b>http://127.0.0.1:4173/</b> 打开。'
      : '常见原因是 Service Worker 的旧缓存与刚改过的代码混在了一起，或某个 JS 文件没加载成功。点下面的按钮清除缓存后重载即可；卡片数据存在 IndexedDB，不会被清掉。';
    var box = document.createElement('div');
    box.id = 'boot-guard';
    box.setAttribute('style', 'position:fixed;inset:0;z-index:9999;background:#F5F5F7;color:#1D1D1F;' +
      'font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:auto;' +
      'padding:calc(env(safe-area-inset-top) + 40px) 22px 40px;box-sizing:border-box');
    box.innerHTML =
      '<div style="max-width:420px;margin:0 auto;background:#fff;border-radius:18px;padding:24px 22px;box-shadow:0 8px 30px rgba(0,0,0,.08)">' +
      '<div style="font-size:22px;font-weight:600;margin-bottom:10px">页面没能启动</div>' +
      '<p style="color:#6E6E73;margin:0 0 14px">' + reason + '</p>' +
      '<div style="font-size:12px;color:#8E8E93;word-break:break-all;background:#F5F5F7;border-radius:10px;padding:10px 12px">' +
      '当前地址：' + location.href + (lastError ? '<br>错误：' + String(lastError).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }) : '') + '</div>' +
      '<button data-fix style="width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:#0071E3;color:#fff;font-size:16px;font-weight:600;cursor:pointer">清除缓存并重载</button>' +
      '<button data-reload style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;background:#E8E8ED;color:#1D1D1F;font-size:16px;cursor:pointer">仅重载</button>' +
      '<p style="font-size:12px;color:#8E8E93;margin:16px 0 0">若仍为空白：按 F12 → Application → Clear storage，或用无痕窗口打开。</p>' +
      '</div>';
    document.body.appendChild(box);
    box.querySelector('[data-fix]').onclick = clearAndReload;
    box.querySelector('[data-reload]').onclick = function () { location.reload(); };
  }

  setTimeout(showProblem, 2500);
})();
</script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
